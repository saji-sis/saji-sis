<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Frontend Skills Galaxy with Logos">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#1a0b12"/>
    </linearGradient>
    <linearGradient id="red2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF7A83"/>
      <stop offset="1" stop-color="#E5232F"/>
    </linearGradient>
    <radialGradient id="nebula2" cx="72%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#E5232F" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E5232F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinRev { to { transform: rotate(-360deg); } }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ring1 { animation: spin 48s linear infinite; transform-origin: 740px 210px; }
    .ring2 { animation: spinRev 36s linear infinite; transform-origin: 740px 210px; }
    .ring3 { animation: spin 65s linear infinite; transform-origin: 740px 210px; }
    .star { animation: twinkle 3.5s ease-in-out infinite; }
    .fade { opacity: 0; animation: fadeUp 0.85s ease forwards; }
    text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .headline { font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: -1.2px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>

  <rect width="1000" height="420" rx="14" fill="url(#bg2)"/>

  <!-- subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#8293A1" stroke-opacity="0.07"/>
  </pattern>
  <rect width="1000" height="420" fill="url(#grid)"/>

  <!-- stars -->
  <g fill="#94a3b8">
    <circle class="star" cx="35" cy="40" r="1.2"/>
    <circle class="star" cx="95" cy="85" r="0.8" style="animation-delay:0.5s"/>
    <circle class="star" cx="170" cy="30" r="1.3" style="animation-delay:1.1s"/>
    <circle class="star" cx="250" cy="70" r="0.7" style="animation-delay:1.8s"/>
    <circle class="star" cx="330" cy="25" r="1" style="animation-delay:0.3s"/>
    <circle class="star" cx="420" cy="90" r="0.9" style="animation-delay:2.2s"/>
    <circle class="star" cx="70" cy="200" r="0.8" style="animation-delay:1.4s"/>
    <circle class="star" cx="40" cy="320" r="1.1" style="animation-delay:0.7s"/>
    <circle class="star" cx="160" cy="380" r="0.9" style="animation-delay:1.9s"/>
  </g>

  <!-- Left content -->
  <text class="fade" x="48" y="52" font-size="11" letter-spacing="2.5" fill="#EF343F" style="animation-delay:0.1s">PORTFOLIO / 2026</text>
  <path d="M48 67H170" stroke="#EF343F" stroke-width="2"/>

  <text class="headline fade" x="45" y="135" font-size="48" fill="#F3F5F7" style="animation-delay:0.25s">
    Frontend <tspan fill="#EF343F">Developer</tspan>
  </text>

  <text class="fade" x="50" y="172" font-size="14" fill="#AAB5C0" style="animation-delay:0.4s">
    Building modern, thoughtful web experiences.
  </text>

  <!-- Tech badges with logos -->
  <g class="fade" style="animation-delay:0.55s">
    <!-- React -->
    <g transform="translate(50,205)">
      <rect width="72" height="34" rx="8" fill="#1e293b" stroke="#61dafb" stroke-width="1.2"/>
      <ellipse cx="18" cy="17" rx="9" ry="3.5" fill="none" stroke="#61dafb" stroke-width="1.2" transform="rotate(0 18 17)"/>
      <ellipse cx="18" cy="17" rx="9" ry="3.5" fill="none" stroke="#61dafb" stroke-width="1.2" transform="rotate(60 18 17)"/>
      <ellipse cx="18" cy="17" rx="9" ry="3.5" fill="none" stroke="#61dafb" stroke-width="1.2" transform="rotate(120 18 17)"/>
      <circle cx="18" cy="17" r="2" fill="#61dafb"/>
      <text x="42" y="21" font-size="11" fill="#e2e8f0">React</text>
    </g>
    <!-- Next.js -->
    <g transform="translate(132,205)">
      <rect width="82" height="34" rx="8" fill="#1e293b" stroke="#fff" stroke-width="1.2"/>
      <text x="16" y="22" font-size="14" font-weight="800" fill="#fff" font-family="Arial">N</text>
      <text x="38" y="21" font-size="11" fill="#e2e8f0">Next.js</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(224,205)">
      <rect width="108" height="34" rx="8" fill="#1e293b" stroke="#3178c6" stroke-width="1.2"/>
      <rect x="10" y="7" width="20" height="20" rx="3" fill="#3178c6"/>
      <text x="13" y="21" font-size="10" font-weight="800" fill="#fff">TS</text>
      <text x="38" y="21" font-size="11" fill="#e2e8f0">TypeScript</text>
    </g>
    <!-- Tailwind -->
    <g transform="translate(342,205)">
      <rect width="95" height="34" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
      <path d="M14 19 Q18 10 22 19 Q26 10 30 19 Q26 26 22 22 Q18 26 14 19Z" fill="#06b6d4"/>
      <text x="40" y="21" font-size="11" fill="#e2e8f0">Tailwind</text>
    </g>
  </g>

  <g class="fade" style="animation-delay:0.7s">
    <!-- JS -->
    <g transform="translate(50,252)">
      <rect width="58" height="30" rx="7" fill="#1e293b" stroke="#f7df1e" stroke-width="1.1"/>
      <rect x="7" y="6" width="18" height="18" rx="2" fill="#f7df1e"/>
      <text x="11" y="19" font-size="9" font-weight="800" fill="#000">JS</text>
      <text x="32" y="19" font-size="10" fill="#e2e8f0">JS</text>
    </g>
    <!-- Redux -->
    <g transform="translate(118,252)">
      <rect width="75" height="30" rx="7" fill="#1e293b" stroke="#764abc" stroke-width="1.1"/>
      <circle cx="18" cy="15" r="7" fill="none" stroke="#764abc" stroke-width="1.6"/>
      <circle cx="18" cy="9" r="2.2" fill="#764abc"/>
      <circle cx="23" cy="17" r="2.2" fill="#764abc"/>
      <circle cx="13" cy="17" r="2.2" fill="#764abc"/>
      <text x="34" y="19" font-size="10" fill="#e2e8f0">Redux</text>
    </g>
    <!-- MUI -->
    <g transform="translate(203,252)">
      <rect width="62" height="30" rx="7" fill="#1e293b" stroke="#007fff" stroke-width="1.1"/>
      <text x="14" y="20" font-size="13" font-weight="800" fill="#007fff" font-family="Arial">M</text>
      <text x="34" y="19" font-size="10" fill="#e2e8f0">MUI</text>
    </g>
    <!-- Sass -->
    <g transform="translate(275,252)">
      <rect width="65" height="30" rx="7" fill="#1e293b" stroke="#cc6699" stroke-width="1.1"/>
      <text x="14" y="20" font-size="14" font-weight="800" fill="#cc6699" font-family="Arial">S</text>
      <text x="34" y="19" font-size="10" fill="#e2e8f0">Sass</text>
    </g>
    <!-- Git -->
    <g transform="translate(350,252)">
      <rect width="58" height="30" rx="7" fill="#1e293b" stroke="#f05032" stroke-width="1.1"/>
      <circle cx="15" cy="10" r="2.8" fill="#f05032"/>
      <circle cx="11" cy="19" r="2.8" fill="#f05032"/>
      <circle cx="19" cy="19" r="2.8" fill="#f05032"/>
      <line x1="15" y1="10" x2="11" y2="19" stroke="#f05032" stroke-width="1.6"/>
      <line x1="15" y1="10" x2="19" y2="19" stroke="#f05032" stroke-width="1.6"/>
      <text x="30" y="19" font-size="10" fill="#e2e8f0">Git</text>
    </g>
    <!-- GitHub -->
    <g transform="translate(418,252)">
      <rect width="80" height="30" rx="7" fill="#1e293b" stroke="#fff" stroke-width="1.1"/>
      <path d="M16 6 C10.5 6 7 9.5 7 14.5 C7 17.5 9 20.2 12 21.2 C12.5 21.4 13 21.1 13 20.6 L13 18.5 C11 19.1 10 17.5 10 16 C9.6 15 9 14 9 13 C9 11 10 10 11 9.5 C10.5 8 11.2 6.5 13 6.5 C14 5.6 15.5 5.2 17 5.2 C18.5 5.2 20 5.6 21 6.5 C22.8 6.5 23.5 8 23 9.5 C24 10 24.5 11 24.5 13 C24.5 14 24 15 23.5 16 C23.5 17.5 22.5 19.1 20.5 18.5 L20.5 20.6 C20.5 21.1 21 21.4 21.5 21.2 C24.5 20.2 26.5 17.5 26.5 14.5 C26.5 9.5 23 6 17.5 6Z" fill="#fff" transform="translate(-1,0)"/>
      <text x="34" y="19" font-size="10" fill="#e2e8f0">GitHub</text>
    </g>
  </g>

  <!-- Right galaxy -->
  <circle cx="740" cy="210" r="145" fill="url(#nebula2)" filter="url(#soft2)"/>

  <circle cx="740" cy="210" r="72" fill="none" stroke="#EF343F" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 6"/>
  <circle cx="740" cy="210" r="108" fill="none" stroke="#50616B" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="740" cy="210" r="140" fill="none" stroke="#EF343F" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="5 8"/>

  <!-- Orbiting logos -->
  <g class="ring1">
    <g transform="translate(740,210)">
      <!-- React -->
      <g transform="translate(0,-72)">
        <circle r="18" fill="#0f172a" stroke="#61dafb" stroke-width="1.5"/>
        <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#61dafb" stroke-width="1.3"/>
        <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#61dafb" stroke-width="1.3" transform="rotate(60)"/>
        <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#61dafb" stroke-width="1.3" transform="rotate(120)"/>
        <circle r="2.2" fill="#61dafb"/>
      </g>
      <!-- Next -->
      <g transform="rotate(90) translate(0,-72)">
        <circle r="18" fill="#0f172a" stroke="#fff" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Arial">N</text>
      </g>
      <!-- TS -->
      <g transform="rotate(180) translate(0,-72)">
        <circle r="18" fill="#0f172a" stroke="#3178c6" stroke-width="1.5"/>
        <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#3178c6"/>
        <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">TS</text>
      </g>
      <!-- Tailwind -->
      <g transform="rotate(270) translate(0,-72)">
        <circle r="18" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
        <path d="M-8 1 Q-4 -6 0 1 Q4 -6 8 1 Q4 7 0 3 Q-4 7 -8 1Z" fill="#06b6d4"/>
      </g>
    </g>
  </g>

  <g class="ring2">
    <g transform="translate(740,210)">
      <g transform="translate(0,-108)">
        <circle r="14" fill="#0f172a" stroke="#f7df1e" stroke-width="1.3"/>
        <rect x="-7" y="-7" width="14" height="14" rx="1.5" fill="#f7df1e"/>
        <text x="0" y="3.5" text-anchor="middle" font-size="8" font-weight="800" fill="#000">JS</text>
      </g>
      <g transform="rotate(120) translate(0,-108)">
        <circle r="14" fill="#0f172a" stroke="#764abc" stroke-width="1.3"/>
        <circle r="6" fill="none" stroke="#764abc" stroke-width="1.5"/>
        <circle cx="0" cy="-4.5" r="2" fill="#764abc"/>
        <circle cx="4" cy="2.5" r="2" fill="#764abc"/>
        <circle cx="-4" cy="2.5" r="2" fill="#764abc"/>
      </g>
      <g transform="rotate(240) translate(0,-108)">
        <circle r="14" fill="#0f172a" stroke="#cc6699" stroke-width="1.3"/>
        <text x="0" y="4.5" text-anchor="middle" font-size="12" font-weight="800" fill="#cc6699" font-family="Arial">S</text>
      </g>
    </g>
  </g>

  <g class="ring3">
    <g transform="translate(740,210)">
      <g transform="translate(0,-140)">
        <circle r="12" fill="#0f172a" stroke="#e34f26" stroke-width="1.2"/>
        <path d="M-6 -6 L-4.5 7 L0 8.5 L4.5 7 L6 -6Z" fill="#e34f26"/>
      </g>
      <g transform="rotate(72) translate(0,-140)">
        <circle r="12" fill="#0f172a" stroke="#1572b6" stroke-width="1.2"/>
        <path d="M-6 -6 L-4.5 7 L0 8.5 L4.5 7 L6 -6Z" fill="#1572b6"/>
      </g>
      <g transform="rotate(144) translate(0,-140)">
        <circle r="12" fill="#0f172a" stroke="#f05032" stroke-width="1.2"/>
        <circle cx="0" cy="-3.5" r="2.2" fill="#f05032"/>
        <circle cx="-3.5" cy="3" r="2.2" fill="#f05032"/>
        <circle cx="3.5" cy="3" r="2.2" fill="#f05032"/>
        <line x1="0" y1="-3.5" x2="-3.5" y2="3" stroke="#f05032" stroke-width="1.3"/>
        <line x1="0" y1="-3.5" x2="3.5" y2="3" stroke="#f05032" stroke-width="1.3"/>
      </g>
      <g transform="rotate(216) translate(0,-140)">
        <circle r="12" fill="#0f172a" stroke="#cb3837" stroke-width="1.2"/>
        <rect x="-7" y="-4" width="14" height="8" rx="1" fill="#cb3837"/>
        <text x="0" y="2" text-anchor="middle" font-size="7" font-weight="800" fill="#fff">npm</text>
      </g>
      <g transform="rotate(288) translate(0,-140)">
        <circle r="12" fill="#0f172a" stroke="#fff" stroke-width="1.2"/>
        <path d="M0 -7 C-5 -7 -8 -4 -8 1 C-8 4 -6 6.5 -3.5 7.2 C-3 7.4 -2.5 7.2 -2.5 6.7 L-2.5 5 C-4 5.5 -5 4 -5 2.5 C-5.3 1.8 -5.8 1 -5.8 0.2 C-5.8 -1.5 -5 -2.2 -4.2 -2.8 C-4.5 -4 -4 -5.5 -2.5 -5.5 C-1.8 -6.2 -0.5 -6.5 0 -6.5 C0.5 -6.5 1.8 -6.2 2.5 -5.5 C4 -5.5 4.5 -4 4.2 -2.8 C5 -2.2 5.8 -1.5 5.8 0.2 C5.8 1 5.3 1.8 5 2.5 C5 4 4 5.5 2.5 5 L2.5 6.7 C2.5 7.2 3 7.4 3.5 7.2 C6 6.5 8 4 8 1 C8 -4 5 -7 0 -7Z" fill="#fff"/>
      </g>
    </g>
  </g>

  <!-- Center S -->
  <circle cx="740" cy="210" r="38" fill="#0f172a" stroke="url(#red2)" stroke-width="2.5"/>
  <text x="740" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="url(#red2)">S</text>

  <text x="960" y="400" text-anchor="end" font-size="9" letter-spacing="2" fill="#8293A1">SS — LOGOS</text>
</svg>
