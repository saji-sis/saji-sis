</defs>
<style>
 text{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}.headline{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:-3px}
 .in{opacity:0;animation:in .75s ease forwards}@keyframes in{to{opacity:1}}
 @keyframes orbit{to{transform:rotate(360deg)}}.orbit{transform-origin:812px 135px;animation:orbit 36s linear infinite}
 @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect x="1" y="1" width="998" height="278" rx="14" fill="url(#bg)" stroke="#493238"/>
<rect x="1" y="1" width="998" height="278" rx="14" fill="url(#grid)"/>
<circle cx="812" cy="135" r="122" fill="#E5232F" opacity=".13" filter="url(#glow)"/>
<path d="M610 0L735 0 1000 230 1000 280 910 280Z" fill="#E5232F" opacity=".045"/>
<g class="orbit"><circle cx="812" cy="135" r="104" fill="none" stroke="#EF343F" stroke-opacity=".8" stroke-dasharray="2 8"/><circle cx="916" cy="135" r="4" fill="#EF343F"/></g>
<circle cx="812" cy="135" r="76" fill="none" stroke="#50616B" stroke-width="1"/>
<circle cx="812" cy="135" r="58" fill="none" stroke="#EF343F" stroke-width="1.5" stroke-dasharray="70 18"/>
