
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-label="Sajad Sistani, Frontend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.6" stop-color="#160A0D"/>
      <stop offset="1" stop-color="#2A0F12"/>
    </linearGradient>
    <radialGradient id="blob" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="0.45" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <style>
      .n{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:58px}
      .s{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:500;font-size:20px;letter-spacing:2px}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="238" rx="16" fill="url(#bg)" stroke="#30363D"/>
  <circle cx="560" cy="120" r="140" fill="url(#halo)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -6;0 6;0 -6" dur="5.5s" repeatCount="indefinite"/>
    <circle cx="560" cy="120" r="58" fill="url(#blob)"/>
  </g>
  <circle cx="170" cy="175" r="22" fill="#DC2626" opacity="0.2">
    <animate attributeName="opacity" values="0.12;0.3;0.12" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <text x="380" y="115" text-anchor="middle" class="n" fill="#FFFFFF">Sajad Sistani</text>
  <text x="380" y="155" text-anchor="middle" class="s" fill="#E5E7EB">Frontend Developer</text>
  <text x="380" y="185" text-anchor="middle" class="s" fill="#9CA3AF" style="font-size:15px;letter-spacing:1px">React · Next.js · TypeScript</text>
</svg>
