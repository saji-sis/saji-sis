<path d="M52 63H170" stroke="#EF343F" stroke-width="2"/>
<text class="headline in" x="48" y="139" font-size="72" fill="#F3F5F7" style="animation-delay:.12s">Sajjad <tspan fill="#EF343F">Sistani.</tspan></text>
