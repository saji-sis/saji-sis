<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Frontend skills orbiting in a galaxy">
<defs>
 <radialGradient id="space"><stop stop-color="#30202a"/><stop offset=".55" stop-color="#151923"/><stop offset="1" stop-color="#0d1117"/></radialGradient>
 <linearGradient id="planet"><stop stop-color="#ff8790"/><stop offset="1" stop-color="#d92336"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif}
 .orbit{fill:none;stroke:#c66b78;stroke-opacity:.35;stroke-width:1.4;stroke-dasharray:4 9}
 .node{fill:#171c27;stroke:#e86b78;stroke-width:1.5}
 .label{fill:#f4e9eb;font-size:14px;font-weight:700;text-anchor:middle}
 .tiny{fill:#d6a3a9;font-size:10px;letter-spacing:2px;text-anchor:middle}
 .spin1{transform-origin:500px 218px;animation:spin 34s linear infinite}
 .spin2{transform-origin:500px 218px;animation:spin 46s linear infinite reverse}
 .spin3{transform-origin:500px 218px;animation:spin 58s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 @media(prefers-reduced-motion:reduce){.spin1,.spin2,.spin3{animation:none}}
</style>
<rect x="1" y="1" width="998" height="438" rx="18" fill="url(#space)" stroke="#493238"/>
<g fill="#f7c6cc" opacity=".65">
 <circle cx="92" cy="70" r="1.5"/><circle cx="166" cy="340" r="1"/><circle cx="270" cy="55" r="1.2"/><circle cx="390" cy="385" r="1.4"/><circle cx="710" cy="48" r="1.2"/><circle cx="850" cy="95" r="1.5"/><circle cx="920" cy="330" r="1.1"/><circle cx="770" cy="390" r="1.4"/><circle cx="58" cy="240" r="1"/><circle cx="945" cy="185" r="1"/>
</g>
<circle cx="500" cy="218" r="86" fill="#e5232f" opacity=".12" filter="url(#soft)"/>
<ellipse class="orbit" cx="500" cy="218" rx="155" ry="58" transform="rotate(-24 500 218)"/>
<ellipse class="orbit" cx="500" cy="218" rx="270" ry="100" transform="rotate(22 500 218)"/>
<ellipse class="orbit" cx="500" cy="218" rx="405" ry="151" transform="rotate(-12 500 218)"/>
<circle cx="500" cy="218" r="64" fill="#e5232f" opacity=".18" filter="url(#shine)"/>
<circle cx="500" cy="218" r="51" fill="#171c27" stroke="#f06a78" stroke-width="2"/>
<circle cx="500" cy="218" r="43" fill="none" stroke="#f06a78" stroke-opacity=".4" stroke-dasharray="3 6"/>
<text x="500" y="211" text-anchor="middle" fill="#fff0f1" font-size="18" font-weight="800">FRONTEND</text>
<text x="500" y="232" class="tiny">DEVELOPMENT</text>
<g class="spin1">
 <g transform="translate(655 218)"><circle class="node" r="29"/><text class="label" y="5">React</text></g>
 <g transform="translate(345 218)"><circle class="node" r="29"/><text class="label" y="5">Next.js</text></g>
</g>
<g class="spin2">
 <g transform="translate(500 118)"><circle class="node" r="28"/><text class="label" y="5">TypeScript</text></g>
 <g transform="translate(500 318)"><circle class="node" r="28"/><text class="label" y="5">JavaScript</text></g>
 <g transform="translate(265 218)"><circle class="node" r="26"/><text class="label" y="5">Redux</text></g>
 <g transform="translate(735 218)"><circle class="node" r="26"/><text class="label" y="5">Tailwind</text></g>
</g>
<g class="spin3">
 <g transform="translate(500 67)"><circle class="node" r="24"/><text class="label" y="5">HTML</text></g>
 <g transform="translate(500 369)"><circle class="node" r="24"/><text class="label" y="5">CSS</text></g>
 <g transform="translate(128 218)"><circle class="node" r="25"/><text class="label" y="5">Git</text></g>
 <g transform="translate(872 218)"><circle class="node" r="25"/><text class="label" y="5">GitHub</text></g>
 <g transform="translate(225 118)"><circle class="node" r="25"/><text class="label" y="5">MUI</text></g>
 <g transform="translate(775 318)"><circle class="node" r="25"/><text class="label" y="5">Bootstrap</text></g>
</g>
<text x="500" y="416" class="tiny">A SMALL GALAXY OF TOOLS I USE TO BUILD THE WEB</text>
</svg>