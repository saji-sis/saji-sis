<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="Minimal animated technology galaxy">
<defs>
 <radialGradient id="bg"><stop stop-color="#19151d"/><stop offset="1" stop-color="#0d1117"/></radialGradient>
 <radialGradient id="planet"><stop stop-color="#f06a78"/><stop offset=".35" stop-color="#b93a4b"/><stop offset="1" stop-color="#25151d"/></radialGradient>
 <filter id="halo"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<style>
 text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
 .orbit{fill:none;stroke:#d77a86;stroke-opacity:.28;stroke-width:1.2}
 .orbit-dash{fill:none;stroke:#d77a86;stroke-opacity:.38;stroke-width:1;stroke-dasharray:2 10}
 .node{fill:#151922;stroke:#a95765;stroke-width:1.2}
 .word{fill:#f2dfe2;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
 .symbol{fill:#f06a78;font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:middle}
 .ring1{transform-origin:500px 170px;animation:orbit 42s linear infinite}
 .ring2{transform-origin:500px 170px;animation:orbit 58s linear infinite reverse}
 .keep1{transform-box:fill-box;transform-origin:center;animation:counter 42s linear infinite}
 .keep2{transform-box:fill-box;transform-origin:center;animation:counter 58s linear infinite reverse}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes counter{to{transform:rotate(-360deg)}}
 @media(prefers-reduced-motion:reduce){.ring1,.ring2,.keep1,.keep2{animation:none!important}}
</style>
<rect x="1" y="1" width="998" height="348" rx="16" fill="url(#bg)" stroke="#493238"/>
<g fill="#e8b2bb" opacity=".5">
 <circle cx="126" cy="72" r="1.2"/><circle cx="224" cy="286" r="1"/><circle cx="334" cy="42" r="1"/><circle cx="682" cy="46" r="1"/><circle cx="790" cy="294" r="1.2"/><circle cx="895" cy="105" r="1"/><circle cx="940" cy="245" r="1.2"/><circle cx="70" cy="218" r="1"/>
</g>
<ellipse class="orbit" cx="500" cy="170" rx="170" ry="62" transform="rotate(-18 500 170)"/>
<ellipse class="orbit-dash" cx="500" cy="170" rx="315" ry="112" transform="rotate(16 500 170)"/>
<circle cx="500" cy="170" r="74" fill="#e84d60" opacity=".12" filter="url(#halo)"/>
<circle cx="500" cy="170" r="42" fill="url(#planet)" stroke="#f28b96" stroke-opacity=".8"/>
<text x="500" y="171" fill="#fff4f5" font-size="22" font-weight="800" text-anchor="middle" dominant-baseline="middle">S</text>
<text x="500" y="230" fill="#b98a92" font-size="10" letter-spacing="2.5" text-anchor="middle">MY TECH UNIVERSE</text>
<g class="ring1">
 <g transform="translate(670 170)"><circle class="node" r="20"/><g class="keep1"><text class="symbol" y="1">Re</text></g></g>
 <g transform="translate(330 170)"><circle class="node" r="20"/><g class="keep1"><text class="symbol" y="1">N</text></g></g>
 <g transform="translate(500 108)"><circle class="node" r="20"/><g class="keep1"><text class="symbol" y="1">TS</text></g></g>
 <g transform="translate(500 232)"><circle class="node" r="20"/><g class="keep1"><text class="symbol" y="1">JS</text></g></g>
</g>
<g class="ring2">
 <g transform="translate(815 170)"><circle class="node" r="18"/><g class="keep2"><text class="word" y="1">Git</text></g></g>
 <g transform="translate(185 170)"><circle class="node" r="18"/><g class="keep2"><text class="word" y="1">CSS</text></g></g>
 <g transform="translate(500 58)"><circle class="node" r="18"/><g class="keep2"><text class="word" y="1">HTML</text></g></g>
 <g transform="translate(500 282)"><circle class="node" r="18"/><g class="keep2"><text class="word" y="1">TW</text></g></g>
</g>
</svg>