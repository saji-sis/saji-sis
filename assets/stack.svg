
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-label="Tech Stack Galaxy">
  <defs>
    <radialGradient id="glow" cx="400" cy="220" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#7F1D1D" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="0.5" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </radialGradient>
    <style>
      .t{font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:13px}
      .h{font-family:'JetBrains Mono','Fira Code',Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:2.5px}
    </style>
  </defs>

  <rect x="1" y="1" width="798" height="438" rx="16" fill="#0D1117" stroke="#30363D"/>
  <rect x="1" y="1" width="798" height="438" rx="16" fill="url(#glow)"/>

  <!-- Twinkling stars -->
  <circle cx="70" cy="55" r="1.3" fill="#fff" opacity="0.25"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="730" cy="80" r="1.1" fill="#fff" opacity="0.25"><animate attributeName="opacity" values="0.15;0.55;0.15" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="340" r="1.4" fill="#fff" opacity="0.25"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="690" cy="360" r="1" fill="#fff" opacity="0.25"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="35" r="0.9" fill="#fff" opacity="0.25"><animate attributeName="opacity" values="0.12;0.45;0.12" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="90" r="1.2" fill="#fff" opacity="0.25"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="580" cy="300" r="1.1" fill="#fff" opacity="0.25"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.5s" repeatCount="indefinite"/></circle>

  <!-- Core (Sun) -->
  <circle cx="400" cy="210" r="52" fill="url(#core)">
    <animate attributeName="r" values="50;55;50" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="200" text-anchor="middle" class="h" fill="#FFFFFF">CORE</text>
  <text x="400" y="218" text-anchor="middle" class="t" fill="#FECACA" style="font-size:12px">React · Next.js</text>
  <text x="400" y="235" text-anchor="middle" class="t" fill="#FECACA" style="font-size:12px">TypeScript</text>

  <!-- Orbit labels -->
  <text x="400" y="95" text-anchor="middle" class="h" fill="#F87171">LANGUAGES</text>
  <text x="400" y="115" text-anchor="middle" class="t" fill="#8B949E">HTML · CSS · JavaScript · TypeScript</text>

  <text x="115" y="200" text-anchor="middle" class="h" fill="#F87171">STATE</text>
  <text x="115" y="220" text-anchor="middle" class="t" fill="#8B949E">Redux</text>
  <text x="115" y="238" text-anchor="middle" class="t" fill="#8B949E">React Query</text>
  <text x="115" y="256" text-anchor="middle" class="t" fill="#8B949E">Context API</text>

  <text x="685" y="200" text-anchor="middle" class="h" fill="#F87171">STYLING</text>
  <text x="685" y="220" text-anchor="middle" class="t" fill="#8B949E">Tailwind</text>
  <text x="685" y="238" text-anchor="middle" class="t" fill="#8B949E">MUI · Bootstrap</text>
  <text x="685" y="256" text-anchor="middle" class="t" fill="#8B949E">Shadcn UI</text>

  <text x="400" y="340" text-anchor="middle" class="h" fill="#F87171">TOOLS &amp; OTHERS</text>
  <text x="400" y="360" text-anchor="middle" class="t" fill="#8B949E">Git · GitHub · VS Code · Figma · npm</text>
  <text x="400" y="378" text-anchor="middle" class="t" fill="#8B949E">React Hook Form · Zod · REST API · Fetch</text>
</svg>
