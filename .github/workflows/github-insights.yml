
name: Generate GitHub Insights

on:
  schedule:
    - cron: "0 3 * * *"   # هر روز ساعت ۳ صبح UTC
  workflow_dispatch:       # امکان اجرای دستی

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Insights SVG
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH: output
          THEME: github_dark
          # اگر خواستی تم قرمزتر بشه می‌تونیم بعداً تغییر بدیم

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # اگر پوشه output وجود نداشت بساز
          mkdir -p output
          
          # فایل‌های تولید شده رو کپی کن (بسته به خروجی اکشن ممکنه اسمش فرق کنه)
          # این اکشن معمولاً چند کارت می‌سازه، ما یکی رو به عنوان github-insights.svg نگه می‌داریم
          if [ -f "profile-summary-card-output/github_dark/0-profile-details.svg" ]; then
            cp profile-summary-card-output/github_dark/0-profile-details.svg output/github-insights.svg
          fi
          
          git add output/
          git commit -m "chore: update github-insights.svg" || echo "No changes"
          git push origin HEAD:output --force
